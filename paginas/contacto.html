<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Tecnologías Web</title>
    
</head>
<body>
    <header>
        <h1>Formulario de Contacto</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="impactoSociedad.html">Impacto Social</a></li>
                <li><a href="impactoNegocios.html">Impacto Empresarial</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Envíanos un Mensaje</h2>
            <p>Si tienes consultas o comentarios sobre el proyecto, por favor completa el formulario:</p>

            <form action="#" method="post">
                <p>
                    <label for="nombre">Nombre completo:</label><br>
                    <input type="text" id="nombre" name="nombre" required placeholder="Escribe tu nombre">
                </p>
                <p>
                    <label for="correo">Correo electrónico:</label><br>
                    <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com">
                </p>
                <p>
                    <label for="asunto">Asunto:</label><br>
                    <input type="text" id="asunto" name="asunto" required placeholder="Motivo de tu mensaje">
                </p>
                <p>
                    <label for="mensaje">Mensaje:</label><br>
                    <textarea id="mensaje" name="mensaje" rows="5" required placeholder="Escribe tu mensaje aquí..."></textarea>
                </p>
                <p>
                    <button type="submit">Enviar Formulario</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Proyecto Tecnologías Web - UTPL</p>
    </footer>
</body>
</html>
